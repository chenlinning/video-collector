services:
  video-collector:
    image: ${VIDEO_COLLECTOR_IMAGE:-ghcr.io/chenlinning/video-collector:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      VIDEO_COLLECTOR_LISTEN: 0.0.0.0:8787
      VIDEO_COLLECTOR_WEB_ROOT: /app/web
      VIDEO_COLLECTOR_TEMP_ROOT: /app/cache/tasks
      TMPDIR: /app/cache/tmp
      WHISPER_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /app/models/ggml-base.bin
      VIDEO_COLLECTOR_MAX_CONCURRENT: ${VIDEO_COLLECTOR_MAX_CONCURRENT:-2}
      VIDEO_COLLECTOR_MAX_QUEUED: ${VIDEO_COLLECTOR_MAX_QUEUED:-4}
      VIDEO_COLLECTOR_PARSE_RATE_LIMIT: ${VIDEO_COLLECTOR_PARSE_RATE_LIMIT:-20}
      VIDEO_COLLECTOR_TASK_RATE_LIMIT: ${VIDEO_COLLECTOR_TASK_RATE_LIMIT:-5}
      VIDEO_COLLECTOR_TASK_TIMEOUT_SECONDS: ${VIDEO_COLLECTOR_TASK_TIMEOUT_SECONDS:-7200}
      VIDEO_COLLECTOR_TRUST_PROXY: ${VIDEO_COLLECTOR_TRUST_PROXY:-true}
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - ./cache:/app/cache
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
